version: '3.8'

services:
  # Base de Datos PostgreSQL para Fusión W2P
  postgres:
    image: postgres:16-alpine
    container_name: fusion-postgres
    restart: always
    environment:
      POSTGRES_USER: fusion_user
      POSTGRES_PASSWORD: fusion_secure_password_2026
      POSTGRES_DB: fusion_w2p_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fusion_user -d fusion_w2p_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicación Principal W2P (Next.js/Vite + NestJS)
  w2p-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fusion-w2p-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SQL_HOST: postgres
      SQL_PORT: 5432
      SQL_USER: fusion_user
      SQL_PASSWORD: fusion_secure_password_2026
      SQL_DB_NAME: fusion_w2p_db
      DATABASE_URL: postgresql://fusion_user:fusion_secure_password_2026@postgres:5432/fusion_w2p_db
      JWT_SECRET: fusion_w2p_jwt_super_secret_key_manizales
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

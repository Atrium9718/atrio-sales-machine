; ==============================================================================
; FUSION CRM — ASTERISK REST INTERFACE (ARI) (ETAPA 17.2)
; ARI escucha ÚNICAMENTE en la red interna de Docker. NUNCA se publica al exterior.
; Contraseña protegida mediante formato crypt (SHA-512 crypt)
; ==============================================================================
[general]
enabled = yes
pretty = no
; allowed_origins queda vacío intencionalmente: nadie se conecta desde un navegador
; directamente a ARI. Solo el servidor backend de Fusion CRM.
allowed_origins =

[fusion]
type = user
read_only = no
password_format = crypt
password = ${ASTERISK_ARI_PASSWORD_CRYPT}

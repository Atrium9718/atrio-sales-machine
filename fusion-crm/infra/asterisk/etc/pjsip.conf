; ==============================================================================
; FUSION CRM — PJSIP CONFIGURATION (ETAPA 17.2)
; Transportes, Plantillas WebRTC / SIP y Troncal SIP de Operador
; ==============================================================================

; ==============================================================================
; 0. PARÁMETROS GLOBALES Y DE SISTEMA
; ==============================================================================
[global]
type = global
user_agent = Fusion CRM PBX 22.6
max_forwards = 70
keep_alive_interval = 20
; Seguridad estricta: prohibido invitados no autorizados sin credenciales
allowguest = no

; ==============================================================================
; 1. TRANSPORTES
; ==============================================================================
; Transporte UDP para señalización SIP con el operador telefónico y softphones
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
external_media_address = ${PUBLIC_IP}
external_signaling_address = ${PUBLIC_IP}
local_net = ${DOCKER_SUBNET}

; Transporte WSS / WS para clientes WebRTC desde el navegador
; Traefik termina TLS en wss://pbx.fusioncg.com/ws y conecta al puerto 8088
[transport-wss]
type = transport
protocol = wss
bind = 0.0.0.0:8088

; ==============================================================================
; 2. PLANTILLA PARAMETRIZADA: TRONCAL SIP DEL OPERADOR (Claro / ETB / Twilio)
; ==============================================================================
[trunk-auth]
type = auth
auth_type = userpass
username = ${TRUNK_USERNAME}
password = ${TRUNK_PASSWORD}

[trunk-aor]
type = aor
contact = sip:${TRUNK_SIP_HOST}:${TRUNK_SIP_PORT}
qualify_frequency = 30
qualify_timeout = 5.0
default_expiration = 120
maximum_expiration = 600

[trunk-endpoint]
type = endpoint
transport = transport-udp
context = fusion-entrante
disallow = all
; Operadores de Colombia trabajan primariamente G.711 (alaw / ulaw)
allow = alaw,ulaw
aors = trunk-aor
auth = trunk-auth
outbound_auth = trunk-auth
dtmf_mode = rfc4733
; direct_media=no SIEMPRE: indispensable para permitir grabación y transferencias en CRM
direct_media = no
force_rport = yes
rewrite_contact = yes
rtp_symmetric = yes
timers = yes
timers_sess_expires = 1800
timers_min_se = 90
send_pai = yes
send_rpid = yes
trust_id_inbound = yes
trust_id_outbound = yes

[trunk-registration]
type = registration
outbound_auth = trunk-auth
server_uri = sip:${TRUNK_SIP_HOST}:${TRUNK_SIP_PORT}
client_uri = sip:${TRUNK_USERNAME}@${TRUNK_SIP_HOST}:${TRUNK_SIP_PORT}
retry_interval = 20
max_retries = 10
expiration = 120
transport = transport-udp

[trunk-identify]
type = identify
endpoint = trunk-endpoint
match = ${TRUNK_SIP_HOST}

; ==============================================================================
; 3. PLANTILLAS DE EXTENSIÓN WEBRTC (Navegador / React)
; ==============================================================================
[webrtc-auth](!)
type = auth
auth_type = userpass

[webrtc-aor](!)
type = aor
max_contacts = 3
remove_existing = yes
qualify_frequency = 30
qualify_timeout = 3.0

[webrtc-endpoint](!)
type = endpoint
transport = transport-wss
context = fusion-entrante
disallow = all
allow = opus,ulaw,alaw
; Atajo oficial que activa use_avpf, media_encryption=dtls, dtls_verify=fingerprint,
; dtls_setup=actpass, ice_support, media_use_received_transport y rtcp_mux
webrtc = yes
dtls_auto_generate_cert = yes
dtls_setup = actpass
dtls_verify = fingerprint
dtls_cert_file = /etc/asterisk/keys/asterisk.pem
dtls_ca_file = /etc/asterisk/keys/ca.crt
direct_media = no
force_rport = yes
rewrite_contact = yes
rtp_symmetric = yes

; ==============================================================================
; 4. PLANTILLAS DE EXTENSIÓN SIP CLÁSICA (Softphones móviles iOS / Android)
; ==============================================================================
[sip-auth](!)
type = auth
auth_type = userpass

[sip-aor](!)
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30
qualify_timeout = 3.0

[sip-endpoint](!)
type = endpoint
transport = transport-udp
context = fusion-entrante
disallow = all
allow = alaw,ulaw
webrtc = no
media_encryption = no
direct_media = no
force_rport = yes
rewrite_contact = yes
rtp_symmetric = yes

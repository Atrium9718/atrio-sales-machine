; ==============================================================================
; FUSION CRM — LOGGING CONFIGURATION (ETAPA 17.2)
; Salida a consola estructurada hacia recolector y rotación con 14 días de retención
; ==============================================================================
[general]
dateformat = %F %T
rotatestrategy = rotate

[logfiles]
; Consola de contenedor Docker (para recolector Fluentd / Loki / Docker daemon)
console => notice,warning,error,security

; Logs archivados en volumen /var/log/asterisk
messages => notice,warning,error
security => security
audit => verbose,dtmf

; Rotación diaria y retención de 14 días (gestionada por script / logrotate)

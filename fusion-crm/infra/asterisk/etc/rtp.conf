; ==============================================================================
; FUSION CRM — RTP MEDIA CONFIGURATION (ETAPA 17.2)
; Rango UDP para audio RTP y soporte ICE/STUN/TURN para NAT Traversal
; ==============================================================================
[general]
rtpstart = ${ASTERISK_RTP_START}
rtpend = ${ASTERISK_RTP_END}
icesupport = yes
stunaddr = stun.l.google.com:19302

; Si el VPS está tras NAT y se requiere TURN, reutiliza el coturn de Etapa 15.6
; turnaddr = ${COTURN_TURN_ADDR}
; turnuser = fusion
; turnpwd = ${TURN_SECRET}

; Algoritmos de chequeo de paquetes RTP
rtpchecksums = yes
strictrtp = yes
probation = 8

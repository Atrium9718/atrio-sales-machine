; ==============================================================================
; FUSION CRM — HTTP & WEBSOCKET ENGINE (ETAPA 17.2)
; Traefik v3 termina TLS (Let's Encrypt) y reenvía en claro por la red interna
; ==============================================================================
[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088
websocket_enabled = yes
sessionlimit = 200
session_inactivity = 30000
session_keep_alive = 15000

; NO habilitar tlsenable: el TLS lo termina Traefik en el reverse proxy (wss://pbx.fusioncg.com/ws)
tlsenable = no

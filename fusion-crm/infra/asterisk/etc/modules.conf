; ==============================================================================
; FUSION CRM — MODULES LOADER (ETAPA 17.2)
; Carga automática con exclusión explícita de módulos no utilizados
; ==============================================================================
[modules]
autoload = yes

; Módulos expresamente descartados para reducir superficie de ataque
; El CRM gestiona buzón, colas, provisión y CDR de forma nativa en VoiceCall
noload => chan_sip.so
noload => app_voicemail.so
noload => app_queue.so
noload => res_phoneprov.so
noload => cdr_csv.so
noload => cdr_custom.so
noload => cdr_manager.so
noload => cdr_syslog.so
noload => cel_custom.so
noload => cel_manager.so

; Desactivar protocolos obsoletos o no necesarios
noload => chan_skinny.so
noload => chan_mgcp.so
noload => chan_unistim.so

; Módulos obligatorios de telefonía moderna (PJSIP, ARI, Stasis, WebRTC, Opus, chan_websocket)
load => res_ari.so
load => res_ari_applications.so
load => res_ari_asterisk.so
load => res_ari_bridges.so
load => res_ari_channels.so
load => res_ari_device_states.so
load => res_ari_endpoints.so
load => res_ari_events.so
load => res_ari_playbacks.so
load => res_ari_recordings.so
load => res_ari_sounds.so
load => res_stasis.so
load => res_pjsip.so
load => res_pjsip_transport_websocket.so
load => res_http_websocket.so
load => res_srtp.so
load => res_crypto.so
load => codec_opus.so
load => chan_websocket.so
load => res_speech.so
load => app_mixmonitor.so
load => func_talkdetect.so
load => res_musiconhold.so
load => res_rtp_asterisk.so
load => res_format_attr_opus.so

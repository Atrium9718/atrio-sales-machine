; ==============================================================================
; FUSION CRM — EXTENSIONS DIALPLAN (ETAPA 17.2)
; Diseño arquitectónico: Toda la lógica reside en la aplicación ARI (fusion-voz)
; ==============================================================================
[general]
static = yes
writeprotect = yes
clearglobalvars = no

[fusion-entrante]
exten => _.,1,NoOp(Entrante ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(CHANNEL(hangup_handler_push)=fusion-hangup,s,1)
 same => n,Stasis(fusion-voz,inbound,${EXTEN})
 same => n,Hangup()

; Lo que marcan las extensiones (navegador o celular con app SIP): otra extensión
; de 3-4 dígitos es llamada interna; un número externo sale por la troncal.
[fusion-interno]
exten => _X.,1,NoOp(Extensión ${CALLERID(num)} marca ${EXTEN})
 same => n,Stasis(fusion-voz,internal,${EXTEN})
 same => n,Hangup()

[fusion-saliente]
exten => _.,1,NoOp(Saliente -> ${EXTEN})
 same => n,Stasis(fusion-voz,outbound,${EXTEN})
 same => n,Hangup()

[fusion-hangup]
exten => s,1,NoOp(Colgó ${CHANNEL} causa ${HANGUPCAUSE})
 same => n,Return()

name: Fusion CRM · CI

on:
  push:
    branches: [main]
    paths: ['fusion-crm/**', '.github/workflows/fusion-crm-ci.yml']
  pull_request:
    paths: ['fusion-crm/**', '.github/workflows/fusion-crm-ci.yml']
  workflow_dispatch:

concurrency:
  group: fusion-crm-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: fusion-crm

jobs:
  checks:
    name: Tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Instalar dependencias (postinstall genera el cliente Prisma)
        run: bun install --frozen-lockfile

      - name: Configuración de Firebase de ejemplo (el build la importa)
        run: cp firebase-applet-config.example.json firebase-applet-config.json

      - name: Verificar tipos
        run: bun run lint

      - name: Pruebas unitarias
        run: npx vitest run

      - name: Build (cliente Vite + servidor)
        run: bun run build

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configuración de Firebase de ejemplo
        run: cp firebase-applet-config.example.json firebase-applet-config.json

      - name: Construir imagen
        run: docker build -t fusion-crm:ci .
